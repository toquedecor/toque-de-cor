name: Sync CITEL → Supabase

on:
  schedule:
    - cron: "0 * * * *"   # a cada hora
  workflow_dispatch:
    inputs:
      force:
        description: "Forçar sync mesmo sem alterações na CADITE"
        required: false
        default: "false"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Diagnóstico de rede (IP do runner + teste TCP no CITEL)
        run: |
          echo "=== IP público deste runner ==="
          curl -s https://api.ipify.org && echo ""
          echo "=== DNS do servidor CITEL ==="
          nslookup ${{ secrets.MYSQL_HOST }} || true
          echo "=== Teste TCP porta ${{ secrets.MYSQL_PORT }} (timeout 10s) ==="
          timeout 10 bash -c "echo > /dev/tcp/${{ secrets.MYSQL_HOST }}/${{ secrets.MYSQL_PORT }}" \
            && echo "PORTA ABERTA ✅" \
            || echo "PORTA FECHADA / TIMEOUT ❌"

      - name: Instalar dependências
        run: pip install --no-cache-dir "PyMySQL>=1.1.0" "supabase>=2.0.0" "python-dotenv>=1.0.0"

      - name: Executar sync CITEL → Supabase
        env:
          MYSQL_HOST:     ${{ secrets.MYSQL_HOST }}
          MYSQL_USER:     ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_PORT:     ${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          SUPABASE_URL:   ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:   ${{ secrets.SUPABASE_KEY }}
          SYNC_FORCE:     ${{ github.event.inputs.force || 'false' }}
        run: python sync_citel_supabase.py
