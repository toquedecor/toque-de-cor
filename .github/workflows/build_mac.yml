name: Gerar App Mac

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite rodar manualmente pelo site do GitHub

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Localizar arquivos estáticos do Streamlit
        id: st_path
        run: |
          ST=$(python -c "import streamlit, os; print(os.path.dirname(streamlit.__file__))")
          echo "path=$ST" >> "$GITHUB_OUTPUT"

      - name: Compilar .app com PyInstaller
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --name "Toque de Cor" \
            --onedir \
            --windowed \
            --add-data "${{ steps.st_path.outputs.path }}:streamlit" \
            --add-data "app.py:." \
            --add-data "db.py:." \
            --add-data "Tabela SW Suvinil Geral.xlsx:." \
            --add-data "pedidos.json:." \
            --add-data "similares.json:." \
            --hidden-import streamlit \
            --hidden-import streamlit.web.bootstrap \
            --hidden-import streamlit.web.server \
            --hidden-import streamlit.runtime \
            --hidden-import mysql.connector \
            --hidden-import openpyxl \
            --hidden-import altair \
            --collect-all streamlit \
            --collect-all altair \
            --collect-all pydeck \
            launcher.py

      - name: Remover bloqueio Gatekeeper
        run: xattr -rd com.apple.quarantine "dist/Toque de Cor.app" || true

      - name: Compactar .app para download
        run: |
          cd dist
          zip -r "../Toque-de-Cor-Mac.zip" "Toque de Cor.app"

      - name: Disponibilizar para download
        uses: actions/upload-artifact@v4
        with:
          name: Toque-de-Cor-Mac
          path: Toque-de-Cor-Mac.zip
          retention-days: 30
